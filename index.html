<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NexaFlow Technologies | AI, Data &amp; Digital Solutions</title>
    <meta
      name="description"
      content="NexaFlow Technologies delivers AI automation, custom web development, data analytics, machine learning solutions, and practical technology training."
    />
    <meta name="theme-color" content="#03051B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NexaFlow" />

    <!-- Favicons & App Icons derived strictly from the approved NexaFlow N symbol -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- OpenGraph & Social Metadata (uses full horizontal branded social card, never favicon) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NexaFlow Technologies" />
    <meta property="og:title" content="NexaFlow Technologies | AI, Data &amp; Digital Solutions" />
    <meta
      property="og:description"
      content="AI automation, web platforms, data analytics, machine learning, and structured online training."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NexaFlow Technologies | AI, Data &amp; Digital Solutions" />
    <meta
      name="twitter:description"
      content="AI automation, web platforms, data analytics, machine learning, and structured online training."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Self-Hosted Typography Preloads (zero external font requests) -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/plus-jakarta-sans-latin-normal-8.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/dm-sans-latin-normal-4.woff2"
      crossorigin
    />

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('nf-theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F6F8FC] text-[#070B24] dark:bg-[#03051B] dark:text-[#F7F8FF] antialiased selection:bg-[#176BFF] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
